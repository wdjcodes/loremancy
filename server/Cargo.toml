[package]
name = "loremancy-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-login = "0.18.0"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34" }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "uuid",
    "macros",
] }
tokio = { version = "1.53.1", features = ["full"] }
tower-session = "0.0.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
y-sync = { version = "0.4.0", features = ["net"] }
yrs = "0.17.4"
yrs-axum = "0.8.2"
